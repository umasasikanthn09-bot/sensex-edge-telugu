<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSEX Edge Algo Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-cyan-400 mb-4">SENSEX Edge Auto Trader</h2>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Select Broker</label>
                <select id="brokerSelect" class="w-full p-2 rounded bg-slate-700 text-white border border-slate-600">
                    <option value="AngelOne">AngelOne</option>
                    <option value="Zerodha">Zerodha</option>
                    <option value="Dhan">Dhan</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">API Key</label>
                <input type="text" id="apiKey" class="w-full p-2 rounded bg-slate-700 text-white border border-slate-600" placeholder="Enter API Key">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">API Secret / Password</label>
                <input type="password" id="apiSecret" class="w-full p-2 rounded bg-slate-700 text-white border border-slate-600" placeholder="Enter API Secret">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Lots</label>
                <select id="lotSelect" class="w-full p-2 rounded bg-slate-700 text-white border border-slate-600">
                    <option value="1">1 Lot</option>
                    <option value="2">2 Lots</option>
                    <option value="5">5 Lots</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <input type="checkbox" id="disclaimerCheck" class="w-4 h-4">
                <label for="disclaimerCheck" class="text-xs text-gray-300">నేను మార్కెట్ రిస్క్ మరియు నియమాలను అంగీకరిస్తున్నాను.</label>
            </div>

            <button onclick="startAutoTrader()" class="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2 rounded text-white transition">Connect & Start Auto Algo</button>
            <button onclick="stopAutoTrader()" class="w-full bg-red-600 hover:bg-red-500 font-bold py-2 rounded text-white transition">Stop Auto Trader</button>
        </div>

        <div class="mt-4 p-3 bg-slate-950 rounded text-center">
            Status: <span id="statusText" class="text-gray-400 font-bold">Inactive</span>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://sensex-edge-telugu-backend.onrender.com";

        // బ్రౌజర్‌లో వివరాలు ఆటోమేటిక్‌గా లోడ్ అవ్వడానికి
        document.addEventListener("DOMContentLoaded", function () {
            const savedBroker = localStorage.getItem("saved_broker");
            const savedApiKey = localStorage.getItem("saved_api_key");
            const savedApiSecret = localStorage.getItem("saved_api_secret");

            if (savedBroker) document.getElementById('brokerSelect').value = savedBroker;
            if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;
            if (savedApiSecret) document.getElementById('apiSecret').value = savedApiSecret;
        });

        async function startAutoTrader() {
            const broker = document.getElementById('brokerSelect').value;
            const apiKey = document.getElementById('apiKey').value;
            const apiSecret = document.getElementById('apiSecret').value;
            const lotSize = document.getElementById('lotSelect').value;
            const isChecked = document.getElementById('disclaimerCheck').checked;

            if (!isChecked) {
                alert("దయచేసి నియమాలు మరియు మార్కెట్ రిస్క్ చెక్‌బాక్స్‌ను సెలెక్ట్ చేయండి.");
                return;
            }

            if (!apiKey || !apiSecret) {
                alert("దయచేసి API Key మరియు Secret రెంటిని ఎంటర్ చేయండి.");
                return;
            }

            // వివరాలను సేవ్ చేయడం
            localStorage.setItem("saved_broker", broker);
            localStorage.setItem("saved_api_key", apiKey);
            localStorage.setItem("saved_api_secret", apiSecret);

            try {
                const response = await fetch(`${BACKEND_URL}/start-strategy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        broker: broker,
                        api_key: apiKey,
                        api_secret: apiSecret,
                        lots: parseInt(lotSize)
                    })
                });

                const res = await response.json();
                if (response.ok) {
                    document.getElementById('statusText').innerText = "Active & Auto Engine Running";
                    document.getElementById('statusText').className = "text-emerald-400 font-bold";
                    alert(res.message);
                } else {
                    alert("Error: " + res.detail);
                }
            } catch (err) {
                alert("బ్యాకెండ్ ఇంజిన్ అందుబాటులో లేదు. Python Server రన్ అవుతుందో లేదో చూడండి.");
            }
        }

        function stopAutoTrader() {
            document.getElementById('statusText').innerText = "Stopped";
            document.getElementById('statusText').className = "text-red-400 font-bold";
            alert("ఆటో ట్రేడింగ్ నిలిపివేయబడింది.");
        }
    </script>
</body>
</html>
