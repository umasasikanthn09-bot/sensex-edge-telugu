<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensex Edge Telugu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f17;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <!-- MAIN CONTAINER (EXACT ORIGINAL DESIGN) -->
    <div class="glass-card p-6 rounded-2xl w-full max-w-md mx-auto border border-slate-800 shadow-2xl text-center">
        
        <!-- Top Brand Header -->
        <div class="flex flex-col items-center justify-center mb-6">
            <div class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center border border-slate-700 shadow-md mb-3">
                <span class="text-2xl">🚀</span>
            </div>
            <h1 class="text-2xl font-bold text-yellow-400 tracking-wide">
                Sensex Edge Telugu
            </h1>
            <p class="text-xs text-slate-400 font-medium tracking-widest uppercase mt-1">
                LEARN • PRACTICE • GROW
            </p>
        </div>

        <!-- QR Code Box (Original Styled Border & Alignment) -->
        <div class="relative w-72 h-72 mx-auto mb-6 p-2 rounded-2xl border-2 border-indigo-500/80 bg-slate-950 flex items-center justify-center shadow-2xl">
            <img 
                src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=upi://pay?pa=umasasikanthn04@okhdfcbank&pn=SensexEdge&cu=INR" 
                alt="Payment QR" 
                class="w-full h-full rounded-xl bg-white p-2 object-contain"
            />
        </div>

        <!-- Pricing & UPI Details Box -->
        <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 mb-5 text-left">
            <div class="text-xl font-bold text-emerald-400 mb-1">
                ₹2,499 / Month
            </div>
            <div class="text-xs text-slate-400 mb-1">
                UPI ID:
            </div>
            <div class="text-sm font-semibold text-sky-400 break-all select-all">
                umasasikanthn04@okhdfcbank
            </div>
        </div>

        <!-- Phone Verification Input -->
        <div class="text-left mb-4">
            <label class="block text-xs text-slate-300 mb-2">
                Enter Phone/Cell Number (for Verification)
            </label>
            <input 
                type="tel" 
                id="phoneInput"
                placeholder="10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి" 
                class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-emerald-500"
            />
        </div>

        <!-- Action Buttons -->
        <button onclick="handleVerification()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl shadow-lg transition mb-3">
            Continue
        </button>

        <a href="https://wa.me/" target="_blank" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-xl border border-slate-700 flex items-center justify-center gap-2 text-sm transition mb-4">
            <span>💬</span> Contact Admin on WhatsApp
        </a>

        <a href="#" class="text-xs text-yellow-500/80 hover:text-yellow-400 inline-flex items-center gap-1">
            🔐 Admin Panel Access
        </a>
    </div>

    <script>
        function handleVerification() {
            const phone = document.getElementById('phoneInput').value;
            if(!phone || phone.length < 10) {
                alert("దయచేసి సరియైన 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి.");
                return;
            }
            alert("మీ రిక్వెస్ట్ పంపబడింది. అడ్మిన్ వెరిఫికేషన్ పూర్తయ్యాక అల్గో యాక్టివ్ అవుతుంది.");
        }
    </script>
</body>
</html>
