<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSEX EDGE TELUGU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #060913; color: #ffffff; font-family: sans-serif; }
        .card-bg { background-color: #0b1120; border: 1px solid #1e293b; }
        .inner-box { background-color: #070d19; border: 1px solid #172554; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

    <div class="w-full max-w-md space-y-5">

        <!-- 1. WELCOME -->
        <div id="welcomeScreen" class="card-bg rounded-2xl p-8 text-center shadow-2xl space-y-3 fade-in border border-yellow-500/20">
            <h1 class="text-2xl font-extrabold text-yellow-400">Sensex Edge Telugu</h1>
            <p class="text-xs text-slate-400 tracking-widest uppercase">Learn • Practice • Grow</p>
        </div>

        <!-- 2. YOUTUBE -->
        <div id="youtubeScreen" class="hidden card-bg rounded-2xl p-6 text-center shadow-2xl space-y-4 fade-in border border-red-500/20">
            <h2 class="text-lg font-bold">పరిశీలించండి, Join అవ్వండి!</h2>
            <a href="https://youtube.com/@sensexedgetelugu-w5d?si=YJJ-Nx5izcub36k2" target="_blank" class="block w-full bg-red-600 p-3 rounded-xl font-bold">YouTube Join</a>
            <button onclick="showPayment()" class="w-full bg-slate-800 p-3 rounded-xl font-bold">Continue ➔</button>
        </div>

        <!-- 3. PAYMENT GATEWAY -->
        <div id="paymentScreen" class="hidden card-bg rounded-2xl p-6 shadow-2xl space-y-4 fade-in border border-emerald-500/20">
            <h2 class="text-lg font-bold text-emerald-400 text-center">Payment Required</h2>
            <div class="inner-box p-4 rounded-xl text-center">
                <p class="text-sm text-slate-300">UPI ID:</p>
                <p class="text-lg font-bold text-white">umasasikanthn04@okhdfcbank</p>
                <p class="text-xs text-slate-500 mt-2">Indian Overseas Bank 0761</p>
            </div>
            <button onclick="showMainApp()" class="w-full bg-emerald-600 p-3 rounded-xl font-bold text-white">I have paid, Continue</button>
            <button onclick="adminLogin()" class="w-full text-xs text-slate-500 underline">Admin Access</button>
        </div>

        <!-- 4. MAIN APP (OLD FORMAT) -->
        <div id="mainApp" class="hidden space-y-5 fade-in">
            <!-- మీ పాత ట్రేడింగ్ UI కోడ్ ఇక్కడ ఉంటుంది -->
            <h1 class="text-center text-xl font-bold text-yellow-400">SENSEX EDGE DASHBOARD</h1>
            <!-- Trading logic ... -->
            <button onclick="location.reload()" class="w-full bg-rose-600 p-3 rounded-xl font-bold">Logout</button>
        </div>

    </div>

    <script>
        // Transition Logic
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('youtubeScreen').classList.remove('hidden');
            }, 2000);
        });

        function showPayment() {
            document.getElementById('youtubeScreen').classList.add('hidden');
            document.getElementById('paymentScreen').classList.remove('hidden');
        }

        function showMainApp() {
            document.getElementById('paymentScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
        }

        // ADMIN LOGIN
        function adminLogin() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "merababa@123") {
                alert("Welcome Admin! Access Granted.");
                showMainApp();
            } else {
                alert("Incorrect Password!");
            }
        }
    </script>
</body>
</html>
