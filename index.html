<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSEX Edge Auto-Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold text-sky-400 mb-6 text-center">🚀 SENSEX Edge Trading Engine</h1>

        <!-- 1. BROKER INTEGRATION SECTION -->
        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 mb-6">
            <h2 class="text-md font-semibold text-sky-400 mb-3">🔑 Broker API Settings</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Select Broker</label>
                    <select id="brokerSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
                        <option value="upstox">Upstox</option>
                        <option value="angelone">AngelOne</option>
                        <option value="zerodha">Zerodha</option>
                        <option value="dhan">Dhan</option>
                        <option value="fyers">Fyers</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">API Key</label>
                    <input type="text" id="apiKey" placeholder="Enter API Key" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">API Secret / Access Token</label>
                    <input type="password" id="apiSecret" placeholder="Enter Access Token" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400 block mb-1">Select Lot Size</label>
                    <select id="lotSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-sky-500">
                        <option value="1">1 Lot (10 Qty)</option>
                        <option value="2">2 Lots (20 Qty)</option>
                        <option value="5">5 Lots (50 Qty)</option>
                    </select>
                </div>

                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="disclaimerCheck" class="rounded bg-slate-900 border-slate-700 text-sky-500">
                    <label for="disclaimerCheck" class="text-xs text-slate-400">నేను అల్గో నియమాలు మరియు మార్కెట్ రిస్క్‌ను అంగీకరిస్తున్నాను.</label>
                </div>

                <div class="pt-2">
                    <button onclick="startAutoTrader()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded transition duration-200">
                        Connect & Start Auto Algo
                    </button>
                </div>
            </div>
        </div>

        <!-- STATUS DISPLAY -->
        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 mb-6 flex justify-between items-center">
            <span class="text-sm text-slate-400">Engine Status:</span>
            <span id="statusText" class="text-slate-500 font-bold">Inactive</span>
        </div>

        <!-- 2. EXECUTED ORDERS HISTORY TABLE -->
        <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-md font-semibold text-sky-400">📜 Executed Orders History</h3>
                <span id="slCountBadge" class="bg-slate-800 text-amber-400 text-xs px-2 py-1 rounded">SL Hits: 0/2</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="p-2">Date & Time</th>
                            <th class="p-2">Symbol</th>
                            <th class="p-2">Type</th>
                            <th class="p-2">Price</th>
                            <th class="p-2">Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-slate-600">No trades executed yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        const BACKEND_URL = "https://sensex-edge-telugu-backend.onrender.com";

        document.addEventListener("DOMContentLoaded", function () {
            const savedBroker = localStorage.getItem("saved_broker");
            const savedApiKey = localStorage.getItem("saved_api_key");
            const savedApiSecret = localStorage.getItem("saved_api_secret");

            if (savedBroker) document.getElementById('brokerSelect').value = savedBroker;
            if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;
            if (savedApiSecret) document.getElementById('apiSecret').value = savedApiSecret;

            setInterval(fetchTradeHistory, 3000);
            fetchTradeHistory();
        });

        async function startAutoTrader() {
            const broker = document.getElementById('brokerSelect').value;
            const apiKey = document.getElementById('apiKey').value;
            const apiSecret = document.getElementById('apiSecret').value;
            const lotSize = document.getElementById('lotSelect').value;
            const isChecked = document.getElementById('disclaimerCheck').checked;

            if (!isChecked) {
                alert("దయచేసి నిబంధనల చెక్‌బాక్స్‌ను సెలెక్ట్ చేయండి.");
                return;
            }

            if (!apiKey || !apiSecret) {
                alert("దయచేసి API Key మరియు Access Token ఎంటర్ చేయండి.");
                return;
            }

            localStorage.setItem("saved_broker", broker);
            localStorage.setItem("saved_api_key", apiKey);
            localStorage.setItem("saved_api_secret", apiSecret);

            try {
                const response = await fetch(`${BACKEND_URL}/start-strategy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        broker: broker,
                        api_key: apiKey,
                        api_secret: apiSecret,
                        lots: parseInt(lotSize)
                    })
                });

                const res = await response.json();
                if (response.ok) {
                    document.getElementById('statusText').innerText = "Active & Running";
                    document.getElementById('statusText').className = "text-emerald-400 font-bold";
                    alert(res.message || "బ్యాకెండ్ ఇంజిన్ సక్సెస్‌ఫుల్‌గా రన్ అయ్యింది!");
                    fetchTradeHistory();
                } else {
                    alert("Error: " + res.detail);
                }
            } catch (err) {
                alert("బ్యాకెండ్ సర్వర్ అందుబాటులో లేదు.");
            }
        }

        async function fetchTradeHistory() {
            try {
                const response = await fetch(`${BACKEND_URL}/get-history`);
                const data = await response.json();

                const slBadge = document.getElementById("slCountBadge");
                if (slBadge && data.state) {
                    slBadge.innerText = `SL Hits: ${data.state.sl_hit_count}/2`;
                }

                const tbody = document.getElementById("historyTableBody");
                if (!tbody) return;

                if (!data.history || data.history.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-slate-600">No trades executed yet today.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                data.history.slice().reverse().forEach(trade => {
                    const typeColor = trade.type === 'BUY' ? 'text-emerald-400' : 'text-rose-400';
                    const row = `
                        <tr class="border-b border-slate-800">
                            <td class="p-2">${trade.datetime}</td>
                            <td class="p-2 font-bold">${trade.symbol}</td>
                            <td class="p-2 font-bold ${typeColor}">${trade.type}</td>
                            <td class="p-2">${trade.price}</td>
                            <td class="p-2"><span class="bg-slate-800 px-2 py-0.5 rounded text-[10px]">${trade.status}</span></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("History error:", err);
            }
        }
    </script>
</body>
            </html>
