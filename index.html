<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSEX Edge Trading Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="max-w-xl mx-auto mt-10 p-6 bg-gray-800 rounded-lg shadow-lg border border-gray-700">
        <h2 class="text-xl font-bold mb-4 text-center text-blue-400">SENSEX Edge Auto Engine</h2>

        <!-- BROKER SELECTION & API INPUTS -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Select Broker:</label>
            <select id="brokerSelect" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none">
                <option value="upstox">Upstox</option>
                <option value="angelone">AngelOne</option>
                <option value="zerodha">Zerodha</option>
                <option value="dhan">Dhan</option>
                <option value="fyers">Fyers</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">API Key / App Key:</label>
            <input type="text" id="apiKey" placeholder="Enter API Key" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">API Secret / Access Token:</label>
            <input type="password" id="apiSecret" placeholder="Enter Access Token" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Select Lots:</label>
            <select id="lotSelect" class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white">
                <option value="1">1 Lot</option>
                <option value="2">2 Lots</option>
                <option value="5">5 Lots</option>
            </select>
        </div>

        <div class="mb-4 flex items-center">
            <input type="checkbox" id="disclaimerCheck" class="mr-2">
            <label for="disclaimerCheck" class="text-xs text-gray-300">నేను నిబంధనలు మరియు మార్కెట్ రిస్క్‌ను అంగీకరిస్తున్నాను.</label>
        </div>

        <button onclick="startAutoTrader()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2 px-4 rounded mb-2">
            Connect & Start Auto Algo
        </button>
        <button onclick="stopAutoTrader()" class="w-full bg-red-600 hover:bg-red-500 font-bold py-2 px-4 rounded mb-4">
            Stop Algo
        </button>

        <div class="p-3 bg-gray-700 rounded text-center mb-6">
            Status: <span id="statusText" class="font-bold text-yellow-400">Not Started</span>
        </div>

        <!-- EXECUTED ORDERS HISTORY TABLE -->
        <div class="mt-6 border-t border-gray-700 pt-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm text-blue-400">📜 Executed Orders History</h3>
                <span id="slCountBadge" class="bg-gray-700 text-yellow-400 text-xs px-2 py-1 rounded">SL Hits: 0/2</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400">
                            <th class="py-2">Date & Time</th>
                            <th class="py-2">Symbol</th>
                            <th class="py-2">Type</th>
                            <th class="py-2">Price</th>
                            <th class="py-2">Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="5" class="py-3 text-center text-gray-500">No trades executed yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://sensex-edge-telugu-backend.onrender.com";

        document.addEventListener("DOMContentLoaded", function () {
            const savedBroker = localStorage.getItem("saved_broker");
            const savedApiKey = localStorage.getItem("saved_api_key");
            const savedApiSecret = localStorage.getItem("saved_api_secret");

            if (savedBroker) document.getElementById('brokerSelect').value = savedBroker;
            if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;
            if (savedApiSecret) document.getElementById('apiSecret').value = savedApiSecret;

            setInterval(fetchTradeHistory, 3000);
            fetchTradeHistory();
        });

        async function startAutoTrader() {
            const broker = document.getElementById('brokerSelect').value;
            const apiKey = document.getElementById('apiKey').value;
            const apiSecret = document.getElementById('apiSecret').value;
            const lotSize = document.getElementById('lotSelect').value;
            const isChecked = document.getElementById('disclaimerCheck').checked;

            if (!isChecked) {
                alert("దయచేసి నిబంధనల చెక్‌బాక్స్‌ను సెలెక్ట్ చేయండి.");
                return;
            }

            if (!apiKey || !apiSecret) {
                alert("దయచేసి API Key మరియు Access Token ఎంటర్ చేయండి.");
                return;
            }

            localStorage.setItem("saved_broker", broker);
            localStorage.setItem("saved_api_key", apiKey);
            localStorage.setItem("saved_api_secret", apiSecret);

            try {
                const response = await fetch(`${BACKEND_URL}/start-strategy`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        broker: broker,
                        api_key: apiKey,
                        api_secret: apiSecret,
                        lots: parseInt(lotSize)
                    })
                });

                const res = await response.json();
                if (response.ok) {
                    document.getElementById('statusText').innerText = "Active & Auto Engine Running";
                    document.getElementById('statusText').className = "font-bold text-green-400";
                    alert(res.message || "బ్యాకెండ్ ఇంజిన్ విజయవంతంగా ప్రారంభమైంది!");
                    fetchTradeHistory();
                } else {
                    alert("Error: " + res.detail);
                }
            } catch (err) {
                alert("బ్యాకెండ్ సర్వర్ అందుబాటులో లేదు.");
            }
        }

        function stopAutoTrader() {
            document.getElementById('statusText').innerText = "Stopped";
            document.getElementById('statusText').className = "font-bold text-red-400";
            alert("ఆటో ట్రేడింగ్ నిలిపివేయబడింది.");
        }

        async function fetchTradeHistory() {
            try {
                const response = await fetch(`${BACKEND_URL}/get-history`);
                const data = await response.json();

                const slBadge = document.getElementById("slCountBadge");
                if (slBadge && data.state) {
                    slBadge.innerText = `SL Hits: ${data.state.sl_hit_count}/2`;
                }

                const tbody = document.getElementById("historyTableBody");
                if (!tbody) return;

                if (!data.history || data.history.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-3 text-center text-gray-500">No trades executed yet today.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                data.history.slice().reverse().forEach(trade => {
                    const typeColor = trade.type === 'BUY' ? 'text-green-400' : 'text-red-400';
                    const row = `
                        <tr class="border-b border-gray-700">
                            <td class="py-2">${trade.datetime}</td>
                            <td class="py-2 font-bold">${trade.symbol}</td>
                            <td class="py-2 font-bold ${typeColor}">${trade.type}</td>
                            <td class="py-2">${trade.price}</td>
                            <td class="py-2"><span class="bg-gray-700 px-2 py-0.5 rounded text-xs">${trade.status}</span></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("History fetch error:", err);
            }
        }
    </script>
</body>
</html>
